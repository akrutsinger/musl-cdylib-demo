# Rebuild std from source so panic=immediate-abort can strip the unwinder.
# Without this the .so carries versioned _Unwind_*@GCC_* references that only
# the glibc-linked libgcc_s.so.1 can satisfy, and the musl loader can't load it.
[unstable]
build-std = ["std", "panic_abort"]

[build]
target = "x86_64-unknown-linux-musl"

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = [
    "-C", "target-feature=-crt-static",  # cdylib is unsupported on this target when fully static
    "-Z", "unstable-options",
    "-C", "panic=immediate-abort",       # removes the unwinder, so no _Unwind_* references remain
    "-C", "force-unwind-tables=no",      # nothing unwinds because of immediate-abort, so .eh_frame is ~2.8K of dead tables
    "-Z", "link-native-libraries=no",    # ignore every crate's #[link]/rustc-link-lib, incl. std's unconditional -lgcc_s
    "-C", "link-arg=-lc",                # musl is the only library on the link line
    "-C", "link-arg=-Wl,-z,defs",        # anything musl doesn't define is a link error, not a dlopen() failure
]
